[build-system]
requires = ["setuptools>=75,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxbridge-rvc"
version = "0.2.0"
description = "A Windows desktop RVC voice changer with independent Discord output and monitoring"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy>=1.26.4,<2", "PySide6>=6.8,<6.9", "sounddevice>=0.5,<0.6", "scipy>=1.13,<2", "soxr>=1.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
voxbridge = "voxbridge.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxbridge = ["vendor/**/*", "resources/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
exclude = ["src/voxbridge/vendor", ".work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
